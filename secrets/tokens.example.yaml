# Example only. Enter real values through `sec edit`.
# Do not put real secrets in this file.
#
# The bundle supports exactly two YAML levels:
#   service:
#     secret_name: value
#
# The service and secret names become an environment variable after
# uppercasing and joining with an underscore.
#
# typesafe:
#   api_key: <local TypeSafe API key>
# github:
#   token: <local GitHub token>
# cloudflare:
#   api_token: <local Cloudflare API token>
